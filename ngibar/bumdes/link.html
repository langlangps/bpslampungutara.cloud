<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Pengisian SE2026 - BUMDES Lampung Utara</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        bpsOrange: '#F26522',
                        bpsOrangeLight: '#FFF0E8',
                        bpsOrangeDark: '#D95214',
                        bpsBlue: '#0054A6',
                        bpsBlueLight: '#E5F0FA',
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'slide-in-right': 'slideInRight 0.4s ease-out forwards',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        slideInRight: {
                            '0%': { opacity: '0', transform: 'translateX(-20px)' },
                            '100%': { opacity: '1', transform: 'translateX(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #FAFAFA;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden; /* Mengunci scroll body, scroll akan di handle oleh container */
        }

        /* Glassmorphism khusus sidebar dan topbar */
        .glass-nav {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-right: 1px solid rgba(0, 0, 0, 0.05);
        }

        /* Glassmorphism untuk kartu */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 20px -5px rgba(0,0,0,0.05);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px -10px rgba(242, 101, 34, 0.2);
            border-color: rgba(242, 101, 34, 0.3);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #ddd; 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #F26522; 
        }

        /* Efek klik tombol */
        .btn-clicked {
            transform: scale(0.95) !important;
        }

        /* Background grid pattern dominan oranye */
        .bg-pattern {
            background-size: 60px 60px;
            background-image: 
                linear-gradient(to right, rgba(242, 101, 34, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(242, 101, 34, 0.03) 1px, transparent 1px);
        }

        /* Hiding scrollbar for horizontal mobile nav but keeping functionality */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        

        /* Custom keyframe untuk efek shimmer tombol */
        @keyframes shimmer {
            100% { transform: skewX(-12deg) translateX(200%); }
        }
    </style>
</head>
<body class="text-gray-800 font-sans h-screen w-full flex flex-col md:flex-row">

    <!-- Sidebar / Navigasi Desktop -->
    <aside class="w-72 glass-nav h-full hidden md:flex flex-col z-20 flex-shrink-0 shadow-[4px_0_24px_rgba(0,0,0,0.02)] relative">
        <!-- Logo Area -->
        <div class="p-6 border-b border-gray-100/50 flex flex-col items-center justify-center relative">
            <div class="absolute inset-0 bg-gradient-to-br from-bpsOrangeLight/50 to-transparent z-0"></div>
            <div class="relative z-10 flex items-center justify-center gap-3 w-full">
                <img src="img/logo-bps.png" alt="Logo BPS" class="h-10 w-auto object-contain drop-shadow-sm" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/2/28/Logo_BPS_%28Badan_Pusat_Statistik%29_Indonesia.svg'">
                <div class="h-8 w-px bg-gray-300"></div>
                <img src="img/logo-se2026.png" alt="Logo SE2026" class="h-10 w-auto object-contain drop-shadow-sm" onerror="this.outerHTML='<div class=\'flex flex-col items-center justify-center\'><div class=\'text-bpsOrange font-extrabold text-xl tracking-tighter leading-none flex items-center\'>SE<span class=\'text-bpsBlue ml-0.5\'>2026</span></div></div>'">
            </div>
            <div class="relative z-10 mt-4 text-center">
                <h2 class="text-sm font-bold text-gray-800 leading-tight">Pengisian SE2026</h2>
                <p class="text-[10px] text-gray-500 mt-0.5">Kab. Lampung Utara</p>
            </div>
        </div>

        <!-- Filter Area -->
        <div class="p-4 flex-1 overflow-y-auto" id="desktop-nav">
            <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3 px-2">Filter Kecamatan</p>
            <ul class="space-y-1" id="nav-list-desktop">
                <!-- Nav items will be injected by JS -->
            </ul>
        </div>
        
        <!-- Footer Sidebar -->
        <div class="p-4 border-t border-gray-100 text-center text-[10px] text-gray-400">
            &copy; 2026 BPS Kab. Lampung Utara
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-full relative bg-pattern">
        
        <!-- Ornamen Latar Belakang (Blurry blobs) -->
        <div class="absolute top-0 right-0 w-96 h-96 bg-bpsOrange/10 rounded-full mix-blend-multiply filter blur-3xl opacity-60 pointer-events-none transform translate-x-1/3 -translate-y-1/3"></div>
        <div class="absolute bottom-0 left-0 w-[30rem] h-[30rem] bg-bpsBlue/5 rounded-full mix-blend-multiply filter blur-3xl opacity-60 pointer-events-none transform -translate-x-1/3 translate-y-1/3"></div>

        <!-- Mobile Header & Nav -->
        <div class="md:hidden glass-nav z-20 shadow-sm border-b border-gray-100 flex-shrink-0">
            <div class="p-4 flex justify-between items-center bg-white/50">
                <div class="flex items-center gap-2">
                    <img src="img/logo-bps.png" alt="Logo BPS" class="h-7 w-auto" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/2/28/Logo_BPS_%28Badan_Pusat_Statistik%29_Indonesia.svg'">
                    <div class="h-5 w-px bg-gray-300"></div>
                    <img src="img/logo-se2026.png" alt="SE2026" class="h-7 w-auto" onerror="this.outerHTML='<div class=\'text-bpsOrange font-extrabold text-sm tracking-tighter flex items-center\'>SE<span class=\'text-bpsBlue ml-0.5\'>2026</span></div>'">
                </div>
                <div class="text-right">
                    <h1 class="text-xs font-bold text-gray-800">Form SE2026</h1>
                </div>
            </div>
            
            <!-- Horizontal Scrollable Tabs untuk Mobile -->
            <div class="px-2 py-3 overflow-x-auto no-scrollbar border-t border-gray-50 bg-white/80 backdrop-blur-md">
                <div class="flex space-x-2 w-max px-2" id="nav-list-mobile">
                    <!-- Mobile nav items will be injected by JS -->
                </div>
            </div>
        </div>

        <!-- Area Kartu Data -->
        <div class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 z-10 relative" id="main-scroll-area">
            
            <!-- Header Halaman -->
            <div class="mb-8 mt-2 md:mt-0 max-w-5xl mx-auto">
                <h1 class="text-2xl sm:text-3xl font-black text-gray-800 mb-2">
                    Daftar BUMDES <span class="text-transparent bg-clip-text bg-gradient-to-r from-bpsOrange to-bpsOrangeDark" id="current-kecamatan-title">Seluruh Kecamatan</span>
                </h1>
                <p class="text-sm text-gray-500 font-medium">
                    Silakan cari BUMDES Anda dan klik tautan untuk memulai pengisian pendataan mandiri (CAWI) Sensus Ekonomi 2026.
                </p>
                
                <!-- Statistik Mini -->
                <div class="flex flex-col sm:flex-row gap-4 mt-4">
                    <div class="bg-white/80 backdrop-blur-sm border border-orange-100 rounded-xl px-4 py-2 shadow-sm flex items-center gap-3 w-fit">
                        <div class="w-8 h-8 rounded-full bg-bpsOrangeLight text-bpsOrange flex items-center justify-center font-bold flex-shrink-0">
                            <i class="fas fa-building"></i>
                        </div>
                        <div>
                            <div class="text-xs text-gray-500">Total BUMDES</div>
                            <div class="text-sm font-bold text-gray-800" id="total-count">0</div>
                        </div>
                    </div>

                    <!-- Fitur Search -->
                    <div class="relative flex-1 max-w-md">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-search text-orange-300"></i>
                        </div>
                        <input type="text" id="searchInput" placeholder="Cari nama BUMDES atau Desa..." 
                            class="w-full pl-10 pr-4 py-3 h-full bg-white/80 backdrop-blur-sm border border-orange-100 focus:border-bpsOrange focus:ring-2 focus:ring-bpsOrange/20 rounded-xl text-sm transition-all shadow-sm text-gray-700 placeholder-gray-400 outline-none">
                    </div>
                </div>
            </div>

            <!-- Grid Container Kartu -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 md:gap-6 max-w-5xl mx-auto pb-20" id="cards-container">
                <!-- Cards will be injected by JS -->
            </div>

            <!-- Empty State (Sembunyi by default) -->
            <div id="empty-state" class="hidden flex-col items-center justify-center py-20 opacity-50">
                <i class="fas fa-box-open text-6xl text-gray-300 mb-4"></i>
                <p class="text-gray-500 font-medium">Tidak ada data BUMDES ditemukan.</p>
            </div>

        </div>
    </main>

    <script>
        // Data Dummy JSON (~20 Data)
        const bumdesData = [
            { kec: "Kotabumi", desa: "Kotabumi Tengah", nama: "BUMDes Maju Bersama", link: "#" },
            { kec: "Kotabumi", desa: "Sindang Sari", nama: "BUMDes Sindang Jaya", link: "#" },
            { kec: "Kotabumi Selatan", desa: "Kelapa Tujuh", nama: "BUMDes Tujuh Harapan", link: "#" },
            { kec: "Kotabumi Selatan", desa: "Mulia Asri", nama: "BUMDes Asri Sejahtera", link: "#" },
            { kec: "Kotabumi Selatan", desa: "Tanjung Aman", nama: "BUMDes Aman Sentosa", link: "#" },
            { kec: "Kotabumi Utara", desa: "Madukoro", nama: "BUMDes Madu Murni", link: "#" },
            { kec: "Kotabumi Utara", desa: "Wonomarto", nama: "BUMDes Wono Indah", link: "#" },
            { kec: "Abung Selatan", desa: "Kembang Tanjung", nama: "BUMDes Kembang Wangi", link: "#" },
            { kec: "Abung Selatan", desa: "Trimodadi", nama: "BUMDes Tri Mandiri", link: "#" },
            { kec: "Abung Selatan", desa: "Candimas", nama: "BUMDes Candi Emas", link: "#" },
            { kec: "Bukit Kemuning", desa: "Bukit Kemuning", nama: "BUMDes Puncak Gemilang", link: "#" },
            { kec: "Bukit Kemuning", desa: "Suka Menanti", nama: "BUMDes Menanti Makmur", link: "#" },
            { kec: "Abung Semuli", desa: "Semuli Jaya", nama: "BUMDes Semuli Berkah", link: "#" },
            { kec: "Abung Semuli", desa: "Suka Maju", nama: "BUMDes Maju Terus", link: "#" },
            { kec: "Tanjung Raja", desa: "Tanjung Raja", nama: "BUMDes Raja Agung", link: "#" },
            { kec: "Tanjung Raja", desa: "Suka Mulya", nama: "BUMDes Mulya Abadi", link: "#" },
            { kec: "Sungkai Selatan", desa: "Ketapang", nama: "BUMDes Ketapang Indah", link: "#" },
            { kec: "Sungkai Utara", desa: "Negara Ratu", nama: "BUMDes Ratu Makmur", link: "#" },
            { kec: "Abung Surakarta", desa: "Tata Karya", nama: "BUMDes Karya Nyata", link: "#" },
            { kec: "Abung Timur", desa: "Bumi Agung", nama: "BUMDes Agung Sedaya", link: "#" }
        ];

        // Ekstrak daftar kecamatan unik dan urutkan
        const kecamatanList = [...new Set(bumdesData.map(item => item.kec))].sort();

        let currentFilter = 'Semua';
        let searchQuery = '';

        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Suara klik yang elegan dan minimalis (pop sound)
        function playClickSound() {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.type = 'sine';
            
            // Frekuensi diatur agar lebih warm (nuansa oranye)
            oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.08);

            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);

            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.08);
        }

        function renderNav() {
            const deskNav = document.getElementById('nav-list-desktop');
            const mobNav = document.getElementById('nav-list-mobile');
            
            deskNav.innerHTML = '';
            mobNav.innerHTML = '';

            const navItems = ['Semua', ...kecamatanList];

            navItems.forEach(kec => {
                const isActive = kec === currentFilter;
                
                // --- Desktop Nav Item ---
                const li = document.createElement('li');
                const btnDesk = document.createElement('button');
                btnDesk.className = `w-full flex items-center justify-between px-4 py-3 rounded-xl text-left transition-all duration-200 group ${isActive ? 'bg-gradient-to-r from-bpsOrange to-bpsOrangeDark text-white shadow-md shadow-orange-200' : 'text-gray-600 hover:bg-bpsOrangeLight hover:text-bpsOrange'}`;
                
                let countBadge = '';
                if(kec !== 'Semua') {
                    const count = bumdesData.filter(d => d.kec === kec).length;
                    countBadge = `<span class="text-[10px] py-0.5 px-2 rounded-full ${isActive ? 'bg-white/20 text-white' : 'bg-gray-100 text-gray-500 group-hover:bg-bpsOrange/10 group-hover:text-bpsOrange'}">${count}</span>`;
                }

                btnDesk.innerHTML = `
                    <span class="text-sm font-semibold truncate pr-2"><i class="fas ${kec === 'Semua' ? 'fa-layer-group' : 'fa-map'} w-5 opacity-70"></i> ${kec}</span>
                    ${countBadge}
                `;
                btnDesk.onclick = (e) => handleFilterClick(e, kec, btnDesk);
                li.appendChild(btnDesk);
                deskNav.appendChild(li);


                // --- Mobile Nav Item (Chip Style) ---
                const btnMob = document.createElement('button');
                btnMob.className = `flex-shrink-0 px-4 py-2 rounded-full text-xs font-bold transition-all duration-200 whitespace-nowrap border ${isActive ? 'bg-bpsOrange text-white border-bpsOrange shadow-sm shadow-orange-200' : 'bg-white text-gray-600 border-gray-200 hover:border-bpsOrange hover:text-bpsOrange'}`;
                btnMob.innerHTML = kec;
                btnMob.onclick = (e) => handleFilterClick(e, kec, btnMob);
                mobNav.appendChild(btnMob);
            });
        }

        function handleFilterClick(event, kec, element) {
            initAudio();
            playClickSound();
            
            // Animasi tombol klik
            element.classList.add('btn-clicked');
            setTimeout(() => element.classList.remove('btn-clicked'), 150);

            if (currentFilter !== kec) {
                currentFilter = kec;
                renderNav(); // Re-render untuk update state active
                renderCards();
                
                // Update Title
                document.getElementById('current-kecamatan-title').innerText = kec === 'Semua' ? 'Seluruh Kecamatan' : `Kec. ${kec}`;
                
                // Scroll to top of main area
                document.getElementById('main-scroll-area').scrollTo({top: 0, behavior: 'smooth'});
            }
        }

        function renderCards() {
            const container = document.getElementById('cards-container');
            const emptyState = document.getElementById('empty-state');
            const countEl = document.getElementById('total-count');
            
            container.innerHTML = '';
            
            // Filter berdasarkan Kecamatan DAN Search Query (Nama/Desa)
            const filteredData = bumdesData.filter(d => {
                const matchKec = currentFilter === 'Semua' || d.kec === currentFilter;
                const matchSearch = d.nama.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                    d.desa.toLowerCase().includes(searchQuery.toLowerCase());
                return matchKec && matchSearch;
            });

            countEl.innerText = filteredData.length;

            if (filteredData.length === 0) {
                container.classList.add('hidden');
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                container.classList.remove('hidden');
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');

                filteredData.forEach((item, index) => {
                    const card = document.createElement('div');
                    // Style base card, left border tebal warna oranye
                    card.className = `card-item glass-card rounded-2xl overflow-hidden relative border-l-4 border-l-bpsOrange flex flex-col justify-between`;
                    
                    // Staggered animation delay
                    const delay = index * 50; 
                    card.style.animation = `fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards ${delay}ms`;

                    card.innerHTML = `
                        <div class="p-5 flex-1 relative">
                            <!-- Dekorasi pattern oranye di pojok kanan -->
                            <div class="absolute top-0 right-0 w-16 h-16 bg-gradient-to-bl from-bpsOrangeLight to-transparent opacity-50 rounded-bl-3xl pointer-events-none"></div>
                            
                            <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-bpsOrange/10 text-bpsOrangeDark text-[10px] font-bold tracking-wider uppercase mb-3">
                                <i class="fas fa-map-marker-alt"></i> ${item.kec}
                            </div>
                            
                            <h3 class="text-xl font-extrabold text-gray-800 leading-tight mb-1 group-hover:text-bpsOrange transition-colors">${item.nama}</h3>
                            <p class="text-sm text-gray-500 font-medium flex items-center gap-2">
                                <i class="fas fa-home text-gray-300"></i> Desa ${item.desa}
                            </p>
                        </div>
                        
                        <div class="p-4 pt-0 mt-auto border-t border-dashed border-gray-100 bg-white/50">
                            <a href="${item.link}" onclick="handleLinkClick(event, this)" class="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-bpsOrange to-bpsOrangeDark text-white py-3 px-4 rounded-xl font-bold shadow-md shadow-orange-200/50 hover:shadow-lg hover:-translate-y-0.5 transition-all duration-300 relative overflow-hidden group/btn">
                                <div class="absolute inset-0 bg-white/20 transform -skew-x-12 -translate-x-full group-hover/btn:animate-[shimmer_0.7s_forwards]"></div>
                                Isi CAWI <i class="fas fa-arrow-right text-sm group-hover/btn:translate-x-1 transition-transform"></i>
                            </a>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }
        }

        // Animasi klik untuk link CAWI
        function handleLinkClick(event, element) {
            event.preventDefault(); // Mencegah reload untuk demo
            initAudio();
            playClickSound();
            
            element.classList.add('btn-clicked');
            
            setTimeout(() => {
                element.classList.remove('btn-clicked');
                // Simulasi navigasi
                console.log('Membuka link CAWI...');
                // window.open(element.href, '_blank');
            }, 150);
        }

        window.onload = () => {
            renderNav();
            renderCards();
            
            // Event listener untuk input pencarian
            document.getElementById('searchInput').addEventListener('input', (e) => {
                searchQuery = e.target.value;
                renderCards();
            });

            // Registrasi event listener pertama untuk audio (karena browser policy)
            document.body.addEventListener('touchstart', initAudio, { once: true });
            document.body.addEventListener('click', initAudio, { once: true });
        };
    </script>
</body>
</html>

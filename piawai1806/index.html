<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../img/favicon.ico">
    <title>PIAWAI | Pimpinan Sapa Pegawai</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons (via CDN) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary-orange: #FF7A00;
            --light-orange: #FFF5EB;
            --dark-orange: #E66E00;
            --white: #FFFFFF;
            --text-dark: #2D3436;
            --text-gray: #636E72;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--white);
            color: var(--text-dark);
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
        }

        /* Background Elements - Dinamis */
        .bg-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            background: linear-gradient(135deg, #ffffff 0%, #fff9f3 100%);
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            background: var(--light-orange);
            filter: blur(80px);
            animation: float-around 25s infinite linear;
        }

        .shape-1 { 
            width: 500px; height: 500px; 
            top: -10%; right: -10%; 
            animation-duration: 30s;
        }
        .shape-2 { 
            width: 400px; height: 400px; 
            bottom: -5%; left: -5%; 
            opacity: 0.7;
            animation-duration: 20s;
            animation-direction: reverse;
        }
        .shape-3 { 
            width: 300px; height: 300px; 
            top: 40%; left: 30%; 
            opacity: 0.4;
            animation-duration: 35s;
        }

        @keyframes float-around {
            0% { transform: translate(0, 0) rotate(0deg) scale(1); }
            33% { transform: translate(100px, 50px) rotate(120deg) scale(1.2); }
            66% { transform: translate(-50px, 150px) rotate(240deg) scale(0.8); }
            100% { transform: translate(0, 0) rotate(360deg) scale(1); }
        }

        /* Container */
        .container {
            width: 100%;
            max-width: 450px;
            padding: 40px 20px;
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            transition: var(--transition);
            z-index: 10;
        }

        .container.loaded {
            opacity: 1;
            transform: translateY(0);
        }

        /* Profile Section */
        .profile-img {
            width: 140px;
            height: 120px;
            border-radius: 20%;
            /* border: 4px solid var(--primary-orange); */
            margin-bottom: 20px;
            object-fit: cover;
            padding: 20px;
            background: white;
            transition: var(--transition);
            box-shadow: 0 10px 25px rgba(255, 122, 0, 0.15);
        }

        .profile-img:hover {
            transform: scale(1.1) rotate(3deg);
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-dark);
        }

        .bio {
            font-size: 15px;
            color: var(--text-gray);
            margin-bottom: 32px;
            line-height: 1.5;
        }

        /* Links Section */
        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: var(--white);
            border: 1.5px solid #F0F0F0;
            border-radius: 16px;
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 600;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        /* Shining Effect */
        .link-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                to right,
                transparent,
                rgba(255, 255, 255, 0.6),
                transparent
            );
            transform: skewX(-25deg);
            transition: 0.75s;
        }

        .link-card:hover::after {
            left: 150%;
        }

        .link-card:hover {
            border-color: var(--primary-orange);
            background: var(--primary-orange);
            color: var(--white);
            transform: translateY(-5px);
            box-shadow: 0 15px 30px -10px rgba(255, 122, 0, 0.4);
        }

        .link-card i {
            width: 20px;
            height: 20px;
        }

        .link-icon-left {
            margin-right: 12px;
        }

        .link-content {
            flex-grow: 1;
            text-align: left;
            display: flex;
            align-items: center;
        }

        /* Social Icons */
        .socials {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .social-icon {
            color: var(--text-gray);
            transition: var(--transition);
            text-decoration: none;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .social-icon:hover {
            color: var(--white);
            background: var(--primary-orange);
            transform: translateY(-5px) scale(1.1);
        }

        /* Footer */
        footer {
            margin-top: 50px;
            font-size: 11px;
            color: #BDC3C7;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Staggered Animation for Links */
        .link-card {
            opacity: 0;
            transform: translateX(-20px);
        }

        .loaded .link-card {
            opacity: 1;
            transform: translateX(0);
        }

        .loaded .link-card:nth-child(1) { transition-delay: 0.1s; }
        .loaded .link-card:nth-child(2) { transition-delay: 0.2s; }
        .loaded .link-card:nth-child(3) { transition-delay: 0.3s; }
        .loaded .link-card:nth-child(4) { transition-delay: 0.4s; }
        .loaded .link-card:nth-child(5) { transition-delay: 0.5s; }

    </style>
</head>
<body>

    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="container" id="mainContainer">
        <!-- Profile -->
        <img src="https://upload.wikimedia.org/wikipedia/commons/2/28/Lambang_Badan_Pusat_Statistik_%28BPS%29_Indonesia.svg" alt="Badan Pusat Statistik" class="profile-img">
        <h1>PIAWAI | Pimpinan Sapa Pegawai</h1>
        <p class="bio">Kamis, 23 April 2026</p>

        <!-- Links -->
        <div class="links-wrapper">
            <a href="https://us06web.zoom.us/j/85835428855?pwd=VRIktNr4Uox2aEHMVmz5SQq1rsmajY.1" class="link-card" target="_blank" rel="noopener noreferrer">
                <div class="link-content">
                    <i data-lucide="video" class="link-icon-left"></i>
                    <span>Link Zoom</span>
                </div>
                <i data-lucide="chevron-right"></i>
            </a>

            <a href="https://1drv.ms/f/c/1CADD58323A0E46E/IgARKHzcq1WJTbFQ-G2phsT3AS2Qum2zF4Deq1X9AMjxuts?e=2Rhb3d" class="link-card" target="_blank" rel="noopener noreferrer">
                <div class="link-content">
                    <i data-lucide="wallpaper" class="link-icon-left"></i>
                    <span>Virtual Background</span>
                </div>
                <i data-lucide="chevron-right"></i>
            </a>

            <a href="https://daftarhadir.web.bps.go.id/#/go/5fEhj" class="link-card" target="_blank" rel="noopener noreferrer">
                <div class="link-content">
                    <i data-lucide="book-user" class="link-icon-left"></i>
                    <span>Daftar Hadir</span>
                </div>
                <i data-lucide="chevron-right"></i>
            </a>

            <a href="https://setara.bpslampungutara.cloud" class="link-card" target="_blank" rel="noopener noreferrer">
                <div class="link-content">
                    <i data-lucide="screen-share" class="link-icon-left"></i>
                    <span>Website SETARA</span>
                </div>
                <i data-lucide="chevron-right"></i>
            </a>

        <!-- Social Media -->
        <div class="socials">
            <a href="#" class="social-icon"><i data-lucide="instagram"></i></a>
            <a href="#" class="social-icon"><i data-lucide="twitter"></i></a>
            <a href="#" class="social-icon"><i data-lucide="linkedin"></i></a>
            <a href="#" class="social-icon"><i data-lucide="github"></i></a>
        </div>

        <footer>
            &copy; 2026 * BPS Kabupaten Lampung Utara &hearts;
        </footer>
    </div>

    <script>
        // Inisialisasi Ikon Lucide
        lucide.createIcons();

        // Animasi masuk saat halaman dimuat
        window.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('mainContainer');
            setTimeout(() => {
                container.classList.add('loaded');
            }, 100);
        });

        // Interaksi mouse untuk background (paralaks halus)
        document.addEventListener('mousemove', (e) => {
            const shapes = document.querySelectorAll('.shape');
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            shapes.forEach((shape, index) => {
                const speed = (index + 1) * 20;
                shape.style.transform = `translate(${x * speed}px, ${y * speed}px)`;
            });
        });
    </script>
</body>
</html>
